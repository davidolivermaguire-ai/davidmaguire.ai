project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - index.qmd
    - about.qmd
    - phd/index.qmd
    - research/index.qmd
    - methods/**/*.qmd

website:
  title: "David Maguire"
  description: "PhD research preparation in quantitative finance: the proposal, its research questions, and notes on the methods it uses."
  site-url: "https://davidmaguire.ai"
  favicon: assets/favicon.svg
  search: true
  navbar:
    pinned: true
    left:
      - text: "About"
        href: about.qmd
      - text: "PhD"
        href: phd/index.qmd
      - text: "Research"
        href: research/index.qmd
      - text: "Methods"
        href: methods/index.qmd
    right:
      - icon: envelope
        href: "mailto:davidolivermaguire@gmail.com"
        aria-label: Email
  page-footer:
    border: true
    left: "© 2026 David Maguire"
    center: "PhD research preparation in quantitative finance"
    right: "Built with [Quarto](https://quarto.org)"

format:
  html:
    theme:
      - cosmo
      - styles/theme.scss
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    html-math-method: katex
    highlight-style: github
    link-external-newwindow: true
    grid:
      body-width: 900px

execute:
  enabled: false
