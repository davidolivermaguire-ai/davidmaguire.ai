<text x="718" y="288" class="mut" font-size="11.5" text-anchor="end">reading · confidence · weight vs consensus</text>
<line x1="24" y1="300" x2="736" y2="300" stroke="#eef1f4"/>
<text x="42" y="320" font-size="12.5"><tspan font-weight="600">Trend</tspan><tspan fill="#9aa4ae"> Kalman/HMM</tspan></text><text x="250" y="320" class="sub" font-size="12">up, persistent</text><text x="486" y="320" class="sub" font-size="12" text-anchor="end">0.71</text><text x="556" y="320" font-size="12" text-anchor="end" font-weight="600">0.22</text><rect x="600" y="308" width="92" height="16" rx="8" fill="#e4f0e6"/><text x="646" y="319" font-size="11" fill="#2f7d4f" text-anchor="middle">agree</text>
