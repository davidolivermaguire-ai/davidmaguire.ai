<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 552" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>The AMI decision cockpit — illustrative mock-up</title>
<desc>A dashboard mock-up. A market-state posterior shows probabilities over five states, led by risk-on trend at 0.46. Two meters show transition probability 0.19 rising and council disagreement entropy 0.63 elevated. A calibration badge reads calibrated, Brier 0.15 over the last 60 days. A specialist-evidence table lists six specialists — trend, volatility, structural, cross-asset, macro, and liquidity — with their reading, confidence, reliability weight, and whether they agree with consensus. A governed decision bar proposes a trend sleeve at target volatility 10 percent, notes the risk gate is within limits, gives suitability scores, and provides review-and-approve and override controls; nothing auto-executes without human sign-off. Numbers are illustrative, not live output.</desc>
<style>
  text{fill:#1f2328;}
  .mut{fill:#6b7280;}
  .sub{fill:#55606b;}
</style>

<text x="24" y="27" font-size="16" font-weight="600">AMI console</text>
<text x="158" y="27" class="mut" font-size="12">NASDAQ-100 · as-of 10 Aug 2026, 15:42 ET</text>
<rect x="518" y="11" width="206" height="22" rx="11" fill="#e4f0e6"/>
<text x="530" y="26" font-size="12" fill="#2f7d4f">calibrated · Brier 0.15 · last 60d</text>

<rect x="24" y="52" width="344" height="196" rx="10" fill="#ffffff" stroke="#e6e8eb"/>
<text x="42" y="78" class="mut" font-size="12">market-state posterior</text>
<text x="42" y="112" font-size="12.5" font-weight="600">Risk-on trend</text><rect x="170" y="103" width="118" height="9" rx="4.5" fill="#eef1f4"/><rect x="170" y="103" width="109" height="9" rx="4.5" fill="#2c5f8a"/><text x="350" y="112" font-size="12" text-anchor="end" font-weight="600">0.46</text>
<text x="42" y="138" class="sub" font-size="12.5">Range / mean-revert</text><rect x="170" y="129" width="118" height="9" rx="4.5" fill="#eef1f4"/><rect x="170" y="129" width="52" height="9" rx="4.5" fill="#bcd3e8"/><text x="350" y="138" font-size="12" text-anchor="end" class="sub">0.22</text>
<text x="42" y="164" class="sub" font-size="12.5">Vol expansion</text><rect x="170" y="155" width="118" height="9" rx="4.5" fill="#eef1f4"/><rect x="170" y="155" width="42" height="9" rx="4.5" fill="#bcd3e8"/><text x="350" y="164" font-size="12" text-anchor="end" class="sub">0.18</text>
<text x="42" y="190" class="sub" font-size="12.5">Risk-off</text><rect x="170" y="181" width="118" height="9" rx="4.5" fill="#eef1f4"/><rect x="170" y="181" width="21" height="9" rx="4.5" fill="#bcd3e8"/><text x="350" y="190" font-size="12" text-anchor="end" class="sub">0.09</text>
<text x="42" y="216" class="sub" font-size="12.5">Liquidity stress</text><rect x="170" y="207" width="118" height="9" rx="4.5" fill="#eef1f4"/><rect x="170" y="207" width="12" height="9" rx="4.5" fill="#bcd3e8"/><text x="350" y="216" font-size="12" text-anchor="end" class="sub">0.05</text>

<rect x="384" y="52" width="352" height="90" rx="10" fill="#ffffff" stroke="#e6e8eb"/>
<text x="402" y="80" class="mut" font-size="12">transition probability</text>
<text x="402" y="116" font-size="24" font-weight="600">0.19</text><text x="470" y="116" class="mut" font-size="12">↑ rising</text>

<rect x="384" y="158" width="352" height="90" rx="10" fill="#f7efdd" stroke="#ecdcb4"/>
<text x="402" y="186" font-size="12" fill="#8a6d1f">disagreement · entropy</text>
<text x="402" y="222" font-size="24" font-weight="600" fill="#8a6d1f">0.63</text><text x="470" y="222" font-size="12" fill="#8a6d1f">elevated — watch transitions</text>

<rect x="24" y="264" width="712" height="180" rx="10" fill="#ffffff" stroke="#e6e8eb"/>
