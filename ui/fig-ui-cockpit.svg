<text x="42" y="362" font-size="12.5"><tspan font-weight="600">Structural</tspan><tspan fill="#9aa4ae"> CUSUM</tspan></text><text x="250" y="362" class="sub" font-size="12">no break</text><text x="486" y="362" class="sub" font-size="12" text-anchor="end">0.80</text><text x="556" y="362" font-size="12" text-anchor="end" font-weight="600">0.16</text><rect x="600" y="350" width="92" height="16" rx="8" fill="#e4f0e6"/><text x="646" y="361" font-size="11" fill="#2f7d4f" text-anchor="middle">agree</text>
<text x="42" y="383" font-size="12.5"><tspan font-weight="600">Cross-asset</tspan><tspan fill="#9aa4ae"> DCC</tspan></text><text x="250" y="383" class="sub" font-size="12">risk-on confirm</text><text x="486" y="383" class="sub" font-size="12" text-anchor="end">0.69</text><text x="556" y="383" font-size="12" text-anchor="end" font-weight="600">0.15</text><rect x="600" y="371" width="92" height="16" rx="8" fill="#e4f0e6"/><text x="646" y="382" font-size="11" fill="#2f7d4f" text-anchor="middle">agree</text>
<text x="42" y="404" font-size="12.5"><tspan font-weight="600">Macro</tspan><tspan fill="#9aa4ae"> LLM narrative</tspan></text><text x="250" y="404" class="sub" font-size="12">hawkish surprise</text><text x="486" y="404" class="sub" font-size="12" text-anchor="end">0.58</text><text x="556" y="404" font-size="12" text-anchor="end" font-weight="600">0.14</text><rect x="600" y="392" width="92" height="16" rx="8" fill="#f6e4e4"/><text x="646" y="403" font-size="11" fill="#a3352f" text-anchor="middle">disagree</text>
<text x="42" y="425" font-size="12.5"><tspan font-weight="600">Liquidity</tspan><tspan fill="#9aa4ae"> anomaly</tspan></text><text x="250" y="425" class="sub" font-size="12">normal</text><text x="486" y="425" class="sub" font-size="12" text-anchor="end">0.83</text><text x="556" y="425" font-size="12" text-anchor="end" font-weight="600">0.15</text><rect x="600" y="413" width="92" height="16" rx="8" fill="#e4f0e6"/><text x="646" y="424" font-size="11" fill="#2f7d4f" text-anchor="middle">agree</text>

<rect x="24" y="460" width="712" height="80" rx="10" fill="#f7f9fb" stroke="#e6e8eb"/>
<text x="42" y="482" font-size="11.5" fill="#8a94a0">Governed decision — nothing auto-executes without human sign-off.</text>
<text x="42" y="506" font-size="13" font-weight="600">Trend sleeve → target vol 10% · <tspan fill="#2f7d4f">risk gate within limits</tspan></text>
<text x="42" y="526" class="sub" font-size="12">suitability: trend 0.62 · mean-rev 0.20 · cash 0.12</text>
<rect x="470" y="491" width="96" height="28" rx="6" fill="#ffffff" stroke="#b7c2cd"/><text x="518" y="509" font-size="12.5" fill="#2c5f8a" text-anchor="middle">Override</text>
<rect x="576" y="491" width="160" height="28" rx="6" fill="#2c5f8a"/><text x="656" y="509" font-size="12.5" fill="#ffffff" text-anchor="middle">Review and approve</text>
</svg>
